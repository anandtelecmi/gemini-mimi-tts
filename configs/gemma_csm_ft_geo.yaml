# Stage 2: fine-tune the Emilia-pretrained model on clean single-speaker LJSpeech.
# Run with:  --init_from runs/gemma_csm_emilia/best
# Needs data/processed/ljspeech_csm (16 codebooks, from prepare_csm_dataset.py).

model:
  text_backbone: google/gemma-3-1b-pt
  mimi_repo: kyutai/mimi
  num_quantizers: 16
  codec_embeds: true
  decoder:
    hidden_size: 1024
    num_layers: 6
    num_heads: 8
    intermediate_size: 3072
  decoder_frame_fraction: 0.5
  c0_loss_weight: 1.0
  acoustic_loss_weight: 1.0

data:
  train_shards: data/processed/ljspeech_csm/train-*.pt
  val_shards: data/processed/ljspeech_csm/val-*.pt
  max_seq_len: 1024

training:
  output_dir: runs/gemma_csm_ft_geo
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  backbone_lr: 1.0e-5
  new_lr: 5.0e-5
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  num_train_epochs: 3                # small set: stop early, watch val loss (eval every 100 steps)
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: false
  logging_steps: 20
  eval_steps: 100
  eval_batches: 50
  save_steps: 400
  save_total_limit: 2
  num_workers: 2
  seed: 42

inference:
  max_frames: 600
  temperature_c0: 0.9
  top_k_c0: 50
  temperature_ac: 0.7
  top_k_ac: 20
