[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-mimi-tts"
version = "0.1.0"
description = "Gemma backbone + Mimi codec TTS training pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.50.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "soundfile>=0.12.1",
    "sentencepiece>=0.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["gemma_mimi_tts*"]